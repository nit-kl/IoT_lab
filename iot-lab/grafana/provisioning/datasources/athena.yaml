apiVersion: 1

datasources:
  - name: Athena (store-iot)
    uid: athena-store-iot
    type: grafana-athena-datasource
    isDefault: true
    jsonData:
      authType: keys
      defaultRegion: $__env{AWS_REGION}
      # ワークグループとデータベースの名前には owner が入るので、grafana/.env から読む(setup_aws.py が書く)
      workgroup: $__env{ATHENA_WORKGROUP}
      catalog: AwsDataCatalog
      database: $__env{ATHENA_DATABASE}
    secureJsonData:
      accessKey: $__env{AWS_ACCESS_KEY_ID}
      secretKey: $__env{AWS_SECRET_ACCESS_KEY}
