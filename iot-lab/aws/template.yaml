AWSTemplateFormatVersion: '2010-09-09'
Description: >
  xcp store IoT PoC (supermarket store equipment) - AWS IoT Core -> S3 (raw JSON, partitioned by date) -> Athena,
  plus IoT Core -> Lambda -> DynamoDB (latest value per equipment), alarm mail and remote control.
  Everything here is pay-per-use (no always-on instances). Delete with teardown_aws.py.

# Naming: every name starts with xcp-store-iot-<Owner> (Glue/IoT rule names use '_' instead of '-'),
# so team members can share one AWS account. MQTT topics are store-<Owner>/<GatewayId>/<equipment>/...
Parameters:
  Owner:
    Type: String
    AllowedPattern: '[a-z0-9]{1,16}'
    Description: Who owns this stack within the team (lowercase letters/digits, e.g. kojima)
  GatewayId:
    Type: String
    Default: store01
    AllowedPattern: '[a-zA-Z0-9_-]+'
    Description: Store gateway ID (used in MQTT topics; the IoT thing name is xcp-store-iot-<Owner>-<GatewayId>)
  RetentionDays:
    Type: Number
    Default: 90
    Description: Days to keep raw data in S3 before automatic deletion

Resources:
  # ---------------------------------------------------------------- storage
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'xcp-store-iot-${Owner}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-lab-data
            Status: Enabled
            ExpirationInDays: !Ref RetentionDays

  # ---------------------------------------------------------------- device identity
  GatewayThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: !Sub 'xcp-store-iot-${Owner}-${GatewayId}'

  GatewayPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub 'xcp-store-iot-${Owner}-${GatewayId}-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Least privilege: connect only with its own client ID ...
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/xcp-store-iot-${Owner}-${GatewayId}'
          # ... and publish only under its own topic
          - Effect: Allow
            Action: iot:Publish
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/store-${Owner}/${GatewayId}/*'
          # Remote control: subscribe to exactly its own command filter ('+' is matched literally here) ...
          - Effect: Allow
            Action: iot:Subscribe
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/store-${Owner}/${GatewayId}/+/cmd'
          # ... and receive commands addressed to its own equipment only
          - Effect: Allow
            Action: iot:Receive
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/store-${Owner}/${GatewayId}/*/cmd'

  # ---------------------------------------------------------------- routing (rules engine)
  RuleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'xcp-store-iot-${Owner}-iot-rule'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: iot.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: put-to-s3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub '${DataBucket.Arn}/raw/*'
                  - !Sub '${DataBucket.Arn}/errors/*'

  TelemetryToS3Rule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub 'xcp_store_iot_${Owner}_telemetry_to_s3'
      TopicRulePayload:
        Description: Store every telemetry message in S3 as one JSON object
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        # received_at_ms = when AWS received it. Compare with ts (when the gateway read it).
        Sql: !Sub "SELECT *, timestamp() AS received_at_ms FROM 'store-${Owner}/+/+/telemetry'"
        Actions:
          - S3:
              BucketName: !Ref DataBucket
              RoleArn: !GetAtt RuleRole.Arn
              Key: 'raw/dt=${parse_time("yyyy-MM-dd", timestamp())}/${topic(3)}-${timestamp()}-${newuuid()}.json'
        # If the action fails, the message is saved here instead of being lost (like a dead-letter queue)
        ErrorAction:
          S3:
            BucketName: !Ref DataBucket
            RoleArn: !GetAtt RuleRole.Arn
            Key: 'errors/${newuuid()}.json'

  # ---------------------------------------------------------------- query (Athena)
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub 'xcp_store_iot_${Owner}'

  TelemetryTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: telemetry_raw
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          # Partition projection: Athena works out the dt= folders by itself (no crawler needed)
          projection.enabled: 'true'
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: 2026-01-01,NOW
          projection.dt.interval: '1'
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub 's3://${DataBucket}/raw/dt=${!dt}/'
        PartitionKeys:
          - {Name: dt, Type: string}
        StorageDescriptor:
          Location: !Sub 's3://${DataBucket}/raw/'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              ignore.malformed.json: 'true'
          Columns:
            - {Name: message_id, Type: string}
            - {Name: gateway_id, Type: string}
            - {Name: equipment_id, Type: string}
            - {Name: kind, Type: string}
            - {Name: ts, Type: string}
            - {Name: seq, Type: bigint}
            - {Name: status, Type: string}
            - {Name: metrics, Type: 'map<string,double>'}
            - {Name: received_at_ms, Type: bigint}

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub 'xcp-store-iot-${Owner}'
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        # Stop any single query that would scan more than 1 GB (cost guard)
        BytesScannedCutoffPerQuery: 1073741824
        ResultConfiguration:
          OutputLocation: !Sub 's3://${DataBucket}/athena-results/'

  # ---------------------------------------------------------------- visualization (Grafana, read-only)
  GrafanaUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 'xcp-store-iot-${Owner}-grafana'

  GrafanaUserPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: grafana-athena-readonly
      Users:
        - !Ref GrafanaUser
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Run/read queries, but only against this lab's workgroup
          - Effect: Allow
            Action:
              - athena:StartQueryExecution
              - athena:GetQueryExecution
              - athena:GetQueryResults
              - athena:StopQueryExecution
              - athena:GetWorkGroup
              - athena:ListDatabases
              - athena:ListTableMetadata
            Resource: !Sub 'arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkGroup}'
          # Read table/partition metadata for this lab's database only
          - Effect: Allow
            Action:
              - glue:GetDatabase
              - glue:GetDatabases
              - glue:GetTable
              - glue:GetTables
              - glue:GetPartitions
            Resource:
              - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
              - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}'
              - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/*'
          # Read the raw telemetry data ...
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Sub '${DataBucket.Arn}/raw/*'
          # ... and read/write Athena's own query result cache (separate from the IoT rule's write path)
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub '${DataBucket.Arn}/athena-results/*'
          # Athena calls this before writing results. It sends no s3:prefix, so it cannot
          # share the ListBucket statement below (a missing condition key would deny it).
          - Effect: Allow
            Action: s3:GetBucketLocation
            Resource: !GetAtt DataBucket.Arn
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt DataBucket.Arn
            Condition:
              StringLike:
                s3:prefix: ['raw/*', 'athena-results/*']

  # ---------------------------------------------------------------- latest value (Lambda -> DynamoDB)
  # S3 keeps the history; this table keeps only the current state, one item per equipment.
  LatestTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'xcp-store-iot-${Owner}-latest'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: equipment_id, AttributeType: S}
      KeySchema:
        - {AttributeName: equipment_id, KeyType: HASH}
      # Every change to an item is also published as a stream record (with before/after images)
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  LatestValueLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/xcp/store-iot/${Owner}/latest-value'
      # Logs are kept forever (and billed) unless a retention is set
      RetentionInDays: 7

  LatestValueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'xcp-store-iot-${Owner}-latest-value'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: update-latest-and-log
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Only UpdateItem on this one table (no read, no delete)
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt LatestTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LatestValueLogGroup.Arn

  LatestValueFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'xcp-store-iot-${Owner}-latest-value'
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt LatestValueRole.Arn
      Timeout: 10
      MemorySize: 128
      LoggingConfig:
        LogGroup: !Ref LatestValueLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref LatestTable
      Code:
        # setup_aws.py replaces the line below with the contents of aws/lambda/latest_value.py
        ZipFile: |
          # __CODE:latest_value__

  # A second rule on the same topic: one message fans out to S3 (history) and Lambda (latest)
  LatestValueRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub 'xcp_store_iot_${Owner}_latest_value'
      TopicRulePayload:
        Description: Keep the latest value per equipment in DynamoDB
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: !Sub "SELECT *, timestamp() AS received_at_ms FROM 'store-${Owner}/+/+/telemetry'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt LatestValueFunction.Arn
        ErrorAction:
          S3:
            BucketName: !Ref DataBucket
            RoleArn: !GetAtt RuleRole.Arn
            Key: 'errors/latest-${newuuid()}.json'

  # Lets only this rule (in this account) invoke the function
  LatestValuePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LatestValueFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt LatestValueRule.Arn
      SourceAccount: !Ref AWS::AccountId

  # ---------------------------------------------------------------- alarm notification (Streams + schedule -> Lambda -> SNS)
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'xcp-store-iot-${Owner}-alarm'
      DisplayName: xcp store-iot alarm

  # One item per alarm that has been notified and not yet recovered
  AlarmStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'xcp-store-iot-${Owner}-alarm-state'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}

  AlarmNotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/xcp/store-iot/${Owner}/alarm-notifier'
      RetentionInDays: 7

  AlarmNotifierRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'xcp-store-iot-${Owner}-alarm-notifier'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: notify-alarms
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: !GetAtt LatestTable.StreamArn
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt LatestTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !GetAtt AlarmStateTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlarmTopic
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AlarmNotifierLogGroup.Arn

  AlarmNotifierFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'xcp-store-iot-${Owner}-alarm-notifier'
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt AlarmNotifierRole.Arn
      Timeout: 30
      MemorySize: 128
      LoggingConfig:
        LogGroup: !Ref AlarmNotifierLogGroup
      Environment:
        Variables:
          LATEST_TABLE: !Ref LatestTable
          STATE_TABLE: !Ref AlarmStateTable
          TOPIC_ARN: !Ref AlarmTopic
          STALE_SEC: '120'
          # Food hygiene (HACCP): chilled showcases are kept at or below 10 degC
          TEMP_MAX_C: '10'
      Code:
        # setup_aws.py replaces the line below with the contents of aws/lambda/alarm_notifier.py
        ZipFile: |
          # __CODE:alarm_notifier__

  AlarmStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref AlarmNotifierFunction
      EventSourceArn: !GetAtt LatestTable.StreamArn
      StartingPosition: LATEST
      BatchSize: 10
      # The default (-1) retries a failing batch until the record expires (24h) and blocks
      # everything behind it. Give up after a few tries instead.
      MaximumRetryAttempts: 3

  # "No data arriving" causes no write, so no stream record. Check timestamps every minute instead.
  StaleCheckSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub 'xcp-store-iot-${Owner}-stale-check'
      ScheduleExpression: rate(1 minute)
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: ENABLED
      Target:
        Arn: !GetAtt AlarmNotifierFunction.Arn
        RoleArn: !GetAtt StaleCheckSchedulerRole.Arn
        Input: '{"source": "stale-check"}'

  StaleCheckSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'xcp-store-iot-${Owner}-stale-check-scheduler'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-alarm-notifier
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AlarmNotifierFunction.Arn

  # ---------------------------------------------------------------- remote control (command log)
  # One item per command: send_command.py writes it as "sent", the gateway's result overwrites it.
  CommandTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'xcp-store-iot-${Owner}-commands'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: command_id, AttributeType: S}
      KeySchema:
        - {AttributeName: command_id, KeyType: HASH}

  CommandRuleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'xcp-store-iot-${Owner}-cmd-rule'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: iot.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: put-command-result
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt CommandTable.Arn

  # Each command_id is unique, so a plain overwrite is safe here (unlike the latest-value table,
  # no Lambda / condition is needed: the DynamoDBv2 action writes the JSON as-is)
  CommandResultRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub 'xcp_store_iot_${Owner}_cmd_result'
      TopicRulePayload:
        Description: Record command results (audit log)
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: !Sub "SELECT *, timestamp() AS received_at_ms FROM 'store-${Owner}/+/+/cmd_result'"
        Actions:
          - DynamoDBv2:
              RoleArn: !GetAtt CommandRuleRole.Arn
              PutItem:
                TableName: !Ref CommandTable
        ErrorAction:
          S3:
            BucketName: !Ref DataBucket
            RoleArn: !GetAtt RuleRole.Arn
            Key: 'errors/cmd-${newuuid()}.json'

Outputs:
  BucketName:
    Value: !Ref DataBucket
  PolicyName:
    Value: !Ref GatewayPolicy
  ThingName:
    Value: !Ref GatewayThing
  AthenaWorkGroup:
    Value: !Ref AthenaWorkGroup
  GlueDatabaseName:
    Value: !Ref GlueDatabase
  TopicPrefix:
    Value: !Sub 'store-${Owner}'
  RuleName:
    Value: !Ref TelemetryToS3Rule
  GrafanaUserName:
    Value: !Ref GrafanaUser
  LatestTableName:
    Value: !Ref LatestTable
  LatestValueFunctionName:
    Value: !Ref LatestValueFunction
  LatestValueLogGroup:
    Value: !Ref LatestValueLogGroup
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  AlarmStateTableName:
    Value: !Ref AlarmStateTable
  AlarmNotifierLogGroup:
    Value: !Ref AlarmNotifierLogGroup
  StaleCheckScheduleName:
    Value: !Ref StaleCheckSchedule
  CommandTableName:
    Value: !Ref CommandTable
