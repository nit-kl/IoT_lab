AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  xcp-factoryont: オンプレの抽出プログラムが差分を置く S3 と、証明書で得る短命の認証情報(IAM Roles Anywhere)。
  オンプレに長期のアクセスキーを置かず、権限は raw/ への新規書き込みだけにする。

Parameters:
  Owner:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9]{1,15}$"
  CaCertificate:
    Type: String
    Description: 手元で作った CA の証明書(公開情報。秘密鍵は AWS に送らない)
  ClientCommonName:
    Type: String
    Description: 抽出プログラムの証明書の CN。これ以外の証明書では役割を使えない
  CaCommonName:
    Type: String
  CodeBucket:
    Type: String
    Description: Lambda のコードを置くバケット(setup_aws.py が作る)
  CodeKey:
    Type: String

Resources:
  RawBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${AWS::StackName}-raw-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-raw
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: keep-few-graph-versions
            Status: Enabled
            Prefix: kg/
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
              NewerNoncurrentVersions: 3
      Tags:
        - { Key: Project, Value: xcp-factoryont }
        - { Key: Owner, Value: !Ref Owner }

  RawBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt RawBucket.Arn
              - !Sub "${RawBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  TrustAnchor:
    Type: AWS::RolesAnywhere::TrustAnchor
    Properties:
      Name: !Ref AWS::StackName
      Enabled: true
      Source:
        SourceType: CERTIFICATE_BUNDLE
        SourceData:
          X509CertificateData: !Ref CaCertificate
      Tags:
        - { Key: Project, Value: xcp-factoryont }
        - { Key: Owner, Value: !Ref Owner }

  ExtractorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-extractor"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: rolesanywhere.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
              - sts:SetSourceIdentity
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt TrustAnchor.TrustAnchorArn
              StringEquals:
                aws:PrincipalTag/x509Subject/CN: !Ref ClientCommonName
                aws:PrincipalTag/x509Issuer/CN: !Ref CaCommonName
      Policies:
        - PolicyName: put-raw-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${RawBucket.Arn}/raw/*"
                Condition:
                  "Null":
                    s3:if-none-match: "false"
      Tags:
        - { Key: Project, Value: xcp-factoryont }
        - { Key: Owner, Value: !Ref Owner }

  Profile:
    Type: AWS::RolesAnywhere::Profile
    Properties:
      Name: !Ref AWS::StackName
      Enabled: true
      DurationSeconds: 3600
      RoleArns:
        - !GetAtt ExtractorRole.Arn
      Tags:
        - { Key: Project, Value: xcp-factoryont }
        - { Key: Owner, Value: !Ref Owner }

  # S3 の通知は FIFO キューへ直接送れないので EventBridge を挟む。メッセージは新着の合図で、処理順は Lambda が決める
  UpdateDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-update-dlq.fifo"
      FifoQueue: true
      ContentBasedDeduplication: true
      MessageRetentionPeriod: 1209600
      Tags:
        - { Key: Project, Value: xcp-factoryont }
        - { Key: Owner, Value: !Ref Owner }

  UpdateQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-update.fifo"
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt UpdateDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - { Key: Project, Value: xcp-factoryont }
        - { Key: Owner, Value: !Ref Owner }

  NewBatchRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-new-batch"
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket:
            name: [!Ref RawBucket]
          object:
            key: [{ prefix: raw/ }]
      Targets:
        - Id: update-queue
          Arn: !GetAtt UpdateQueue.Arn
          SqsParameters:
            MessageGroupId: graph

  UpdateQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref UpdateQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt UpdateQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt NewBatchRule.Arn

  UpdaterLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-updater"
      RetentionInDays: 7

  UpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-updater"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: update-graph
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "${RawBucket.Arn}/raw/*"
                  - !Sub "${RawBucket.Arn}/kg/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${RawBucket.Arn}/kg/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt RawBucket.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt UpdateQueue.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt UpdaterLogGroup.Arn
      Tags:
        - { Key: Project, Value: xcp-factoryont }
        - { Key: Owner, Value: !Ref Owner }

  UpdaterFunction:
    Type: AWS::Lambda::Function
    DependsOn: UpdaterLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-updater"
      Runtime: python3.13
      Architectures: [arm64]
      Handler: updater.handler
      MemorySize: 1024
      Timeout: 120
      Role: !GetAtt UpdaterRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          BUCKET: !Ref RawBucket
      Tags:
        - { Key: Project, Value: xcp-factoryont }
        - { Key: Owner, Value: !Ref Owner }

  UpdaterTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt UpdateQueue.Arn
      FunctionName: !Ref UpdaterFunction
      BatchSize: 10

Outputs:
  RawBucketName:
    Value: !Ref RawBucket
  TrustAnchorArn:
    Value: !GetAtt TrustAnchor.TrustAnchorArn
  ProfileArn:
    Value: !GetAtt Profile.ProfileArn
  ExtractorRoleArn:
    Value: !GetAtt ExtractorRole.Arn
  UpdateDeadLetterQueueUrl:
    Value: !Ref UpdateDeadLetterQueue
